<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Foundary</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Bienvenido a Foundary</h1>

  <a href="register.html">Registrarse</a> |
  <nav>
    <a href="login.html">Login</a>
    <button id="logoutBtn" style="display: none;" onclick="logout()">Logout</button>
  </nav>

  <div id="status">No logeado</div>

  <!-- Sección para registrar nuevo objeto (solo visible si estás logeado) -->
  <div id="register-object-form" class="hidden">
    <h2>Registrar nuevo objeto</h2>
    <input type="text" id="description" placeholder="Descripción" /><br />
    <input type="text" id="uniqueCode" placeholder="Código único" /><br />
    <input type="text" id="qrImageUrl" placeholder="URL del QR" /><br />
    <button onclick="registerObject()">Registrar Objeto</button>
  </div>

  <!-- Tabla con objetos del usuario -->
  <div id="user-objects" class="hidden">
    <h2>Mis objetos registrados</h2>
    <table id="objects-table">
      <thead>
        <tr><th>Descripción</th><th>Unique Code</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Sección donde mostraremos los mensajes -->
  <div id="messages-section" class="hidden" style="max-width: 600px; margin-top: 20px;">
    <h3>Mensajes del objeto <span id="messages-object-code"></span></h3>

    <!-- Contenedor scrollable -->
    <div id="message-list" class="message-list"></div>

    <!-- Formulario de envío -->
    <form id="send-message-form" style="display: flex; gap: 8px; margin-top: 10px;">
      <input type="text" id="new-message" placeholder="Escribe un mensaje..." required style="flex: 1; padding: 8px;" />
      <button type="submit" style="padding: 8px 16px;">Enviar</button>
    </form>
  </div>

  <!-- Sección para usuarios que encuentran un objeto que no es suyo -->
  <div id="found-object-section" style="margin-top: 40px;">
    <h3>¿Has encontrado un objeto que no es tuyo?</h3>
    <form id="found-object-form" style="display: flex; gap: 10px;">
      <input type="text" id="found-code-input" placeholder="Introduce el código del objeto" required />
      <button type="submit">Ver mensajes</button>
    </form>
  </div>

  <script src="main.js"></script>
</body>
</html>
